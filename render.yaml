# Render Blueprint: a PostgreSQL database + one Docker web service (API + built SPA).
# Deploy: Render dashboard -> New -> Blueprint -> select this repository -> enter ADMIN_EMAIL and
# ADMIN_PASSWORD -> Apply. Everything else is created and wired up automatically.
#
# NOTE: Render's FREE database is deleted 30 days after creation. Before then either upgrade it
# (Render dashboard -> metalflow-db -> Upgrade) or move to another Postgres (e.g. Neon): remove the
# `databases` block, and set DATABASE_URL to `sync: false` instead of `fromDatabase`.
databases:
  - name: metalflow-db
    databaseName: metalflow
    user: metalflow
    plan: free

services:
  - type: web
    name: metalflow-erp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metalflow-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      # Real deployment: create reference data + the first admin (prompted at Blueprint creation).
      # For a throwaway demo instead, set SEED_DEMO_DATA=true and add DEMO_PASSWORD (generateValue: true).
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: none
      - key: WEB_CONCURRENCY
        value: "1"
