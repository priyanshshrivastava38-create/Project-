# Render Blueprint: one Docker web service (API + built SPA) using an external PostgreSQL
# database (e.g. Neon's free tier; Render's free database is deleted after 30 days).
# Deploy: Render dashboard -> New -> Blueprint -> select this repository; paste the database
# connection string when prompted for DATABASE_URL. See docs/deployment.md.
services:
  - type: web
    name: metalflow-erp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # postgresql://user:password@host/db?sslmode=require
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      # Real deployment: create reference data + the first admin (prompted at Blueprint creation).
      # For a throwaway demo instead, set SEED_DEMO_DATA=true and add DEMO_PASSWORD (generateValue: true).
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: none
      - key: WEB_CONCURRENCY
        value: "1"
