line-length = 130
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "B008",   # FastAPI Depends()/File() defaults are idiomatic
    "S101",   # assert is used in tests
    "S608",   # sequence names in next_number are internal constants, not user input
    "SIM108",
    "SIM905", # readable whitespace-separated word lists
    "S105",   # false positives on enum values such as PASS = "PASS"
    "E501",   # long lines are handled by `ruff format`; remaining ones are strings/messages
]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"scripts/seed.py" = ["E501"]

[format]
quote-style = "double"
